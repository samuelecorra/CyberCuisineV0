<!DOCTYPE html>
<html lang="it">
  <head>
    <!-- Set di caratteri -->
    <meta charset="UTF-8" />
    <!-- Viewport responsivo -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CyberCuisine - Piattaforma Ricette</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600&family=Space+Grotesk:wght@400;500;600&display=swap"
      rel="stylesheet"
    />

    <!-- Bootstrap 5 -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
      crossorigin="anonymous"
    />

    <!-- Stili custom -->
    <link rel="stylesheet" href="../css/theme.css" />
    <link rel="stylesheet" href="../css/base.css" />
    <link rel="stylesheet" href="../css/layout.css" />
    <link rel="stylesheet" href="../css/components.css" />
    <link rel="stylesheet" href="../css/forms.css" />
    <link rel="stylesheet" href="../css/utilities.css" />
    <link rel="stylesheet" href="../css/modal.css" />
  </head>
  <body>
    <!-- Header e navbar -->
    <header class="cc-intestazione shadow-sm">
      <nav class="navbar navbar-expand-lg navbar-dark container px-3">
        <a class="navbar-brand fw-bold d-flex align-items-center gap-2 cc-marchio" href="#/home">
          <img src="../assets/img/cc-logo.png" alt="CyberCuisine" class="testo-marchio" />
        </a>

        <button
          class="navbar-toggler"
          type="button"
          data-bs-toggle="collapse"
          data-bs-target="#ccBarraNav"
          aria-controls="ccBarraNav"
          aria-expanded="false"
          aria-label="Toggle navigation"
        >
          <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="ccBarraNav">
          <ul class="navbar-nav ms-auto mb-2 mb-lg-0" id="ccLinkNavigazione">
            <li class="nav-item">
              <a class="nav-link" href="#/esplora" id="ccLinkEsplora">Esplora ricette</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="#/ricettario">Ricettario</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="#/recensioni">Recensioni</a>
            </li>
            <li class="nav-item dropdown d-none" id="ccUserMenu">
              <a
                class="nav-link dropdown-toggle d-flex align-items-center gap-1"
                href="#"
                role="button"
                id="ccUserMenuToggle"
                data-bs-toggle="dropdown"
                aria-expanded="false"
              >
                <span id="ccUserGreeting">Ciao Chef</span>
              </a>
              <ul class="dropdown-menu dropdown-menu-end shadow" aria-labelledby="ccUserMenuToggle">
                <li>
                  <a class="dropdown-item" href="#/profilo" id="ccGestisciProfilo"
                    >Gestisci profilo</a
                  >
                </li>
                <li>
                  <button class="dropdown-item text-danger" type="button" id="ccLogoutTrigger">
                    Logout
                  </button>
                </li>
              </ul>
            </li>
            <li class="nav-item">
              <a class="nav-link" id="ccLinkAccesso" href="#/registrazione">Registrati / Accedi</a>
            </li>
          </ul>
        </div>
      </nav>
    </header>

    <!-- Contenitore SPA -->
    <main id="app" class="container py-4"></main>

    <!-- Modal conferma azioni carta ricetta -->
    <div
      class="cc-modal-backdrop d-none"
      id="modalAzioniRicetta"
      aria-hidden="true"
      data-confirm-button="modalAzioniConferma"
    >
      <div class="cc-modal" role="dialog" aria-labelledby="modalAzioniTitolo" aria-modal="true">
        <div class="cc-modal-header d-flex justify-content-between align-items-center">
          <h2 class="h6 mb-0" id="modalAzioniTitolo">Conferma azione</h2>
          <button
            class="cc-modal-close"
            type="button"
            id="modalAzioniChiudi"
            aria-label="Chiudi modal"
          >
            &times;
          </button>
        </div>
        <div class="cc-modal-body">
          <p id="modalAzioniMessaggio" class="mb-0"></p>
        </div>
        <div class="cc-modal-footer">
          <button type="button" class="btn btn-contorno-accento" id="modalAzioniAnnulla">
            Annulla
          </button>
          <button type="button" class="btn btn-primary" id="modalAzioniConferma">Conferma</button>
        </div>
      </div>
    </div>

    <!-- Modal conferma logout -->
    <div
      class="cc-modal-backdrop d-none"
      id="modalLogout"
      aria-hidden="true"
      data-confirm-button="modalLogoutConferma"
    >
      <div class="cc-modal" role="dialog" aria-labelledby="modalLogoutTitolo" aria-modal="true">
        <div class="cc-modal-header d-flex justify-content-between align-items-center">
          <h2 class="h6 mb-0" id="modalLogoutTitolo">Confermi il logout?</h2>
          <button
            class="cc-modal-close"
            type="button"
            id="modalLogoutChiudi"
            aria-label="Chiudi modal"
          >
            &times;
          </button>
        </div>
        <div class="cc-modal-body">
          <p class="mb-0">Stai per uscire da CyberCuisine. Vuoi davvero disconnetterti?</p>
        </div>
        <div class="cc-modal-footer">
          <button type="button" class="btn btn-contorno-accento" id="modalLogoutAnnulla">
            Annulla
          </button>
          <button type="button" class="btn btn-danger" id="modalLogoutConferma">Logout</button>
        </div>
      </div>
    </div>

    <!-- Footer -->
    <footer class="cc-piede text-center py-3">
      <small>CyberCuisine - Progetto di Programmazione Web e Mobile - Uni</small>
    </footer>

    <!-- Bootstrap bundle -->
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
      crossorigin="anonymous"
    ></script>

    <!-- Script principale -->
    <script type="module" src="../js/main.js"></script>
  </body>
</html>
