<!-- Vista profilo (singola card con azioni) -->
<section class="row justify-content-center">
  <div class="col-lg-8">
    <div class="card card-bagliore mb-4">
      <div class="card-body">
        <h1 class="h4 mb-3">Profilo personale</h1>

        <div id="infoProfilo"></div>

        <hr class="border-secondary" />

        <form id="formProfilo" novalidate>
          <div class="row g-3">
            <div class="col-md-6">
              <label for="nomeProfilo" class="form-label">Nome</label>
              <input type="text" class="form-control" id="nomeProfilo" disabled required />
            </div>
            <div class="col-md-6">
              <label for="cognomeProfilo" class="form-label">Cognome</label>
              <input type="text" class="form-control" id="cognomeProfilo" disabled required />
            </div>
            <div class="col-md-6">
              <label for="emailProfilo" class="form-label">Email</label>
              <input type="email" class="form-control" id="emailProfilo" disabled required />
            </div>
            <div class="col-md-6">
              <label for="paeseOrigineProfilo" class="form-label">Paese di origine</label>
              <select
                class="form-select select-compatta"
                id="paeseOrigineProfilo"
                disabled
              ></select>
            </div>
            <div class="col-md-6">
              <label for="paeseResidenzaProfilo" class="form-label">Paese di residenza</label>
              <select
                class="form-select select-compatta"
                id="paeseResidenzaProfilo"
                disabled
              ></select>
            </div>
            <div class="col-md-12">
              <label for="piattiPreferitiProfilo" class="form-label"
                >Piatti preferiti (opzionale)</label
              >
              <input
                type="text"
                class="form-control"
                id="piattiPreferitiProfilo"
                disabled
                placeholder="Es. Lasagna, Ramen"
              />
              <div class="form-text">Separa con virgole per inserire piu piatti.</div>
            </div>
            <div class="col-md-6">
              <label for="passwordProfilo" class="form-label">Nuova password</label>
              <input
                type="password"
                class="form-control"
                id="passwordProfilo"
                disabled
                placeholder="Lascia vuoto per non cambiare"
              />
            </div>
          </div>

          <div class="d-flex flex-wrap gap-3 mt-4">
            <button type="button" class="btn btn-primary" id="bottoneModificaProfilo">
              Modifica profilo
            </button>
            <button type="submit" class="btn btn-primary d-none" id="bottoneSalvaProfilo">
              Salva modifiche
            </button>
            <button type="button" class="btn btn-danger ms-auto" id="bottoneEliminaProfilo">
              Elimina profilo
            </button>
          </div>

          <div class="alert alert-success d-none mt-3" id="avvisoProfiloSuccesso"></div>
          <div class="alert alert-danger d-none mt-3" id="avvisoProfiloErrore"></div>
        </form>
      </div>
    </div>
  </div>
</section>

<!-- Modal conferma password -->
<div
  class="modal fade"
  id="modalPassword"
  tabindex="-1"
  aria-labelledby="modalPasswordTitolo"
  aria-hidden="true"
>
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content cc-modal">
      <div class="modal-header border-0">
        <h2 class="h6 mb-0" id="modalPasswordTitolo">Conferma password</h2>
        <button
          class="cc-modal-close"
          type="button"
          id="chiudiModalPassword"
          aria-label="Chiudi modal"
          data-bs-dismiss="modal"
        >
          &times;
        </button>
      </div>
      <div class="modal-body">
        <p class="mb-3">Inserisci la tua password per abilitare la modifica del profilo.</p>
        <div class="mb-3">
          <label for="passwordConfermaProfilo" class="form-label">Password</label>
          <input type="password" class="form-control" id="passwordConfermaProfilo" />
        </div>
        <div class="alert alert-danger d-none" id="erroreModalPassword"></div>
      </div>
      <div class="modal-footer border-0">
        <button
          type="button"
          class="btn btn-contorno-accento"
          id="annullaModalPassword"
          data-bs-dismiss="modal"
        >
          Annulla
        </button>
        <button type="button" class="btn btn-primary" id="confermaModalPassword">Conferma</button>
      </div>
    </div>
  </div>
</div>
