<!-- Ricerca ricette -->
<section class="mb-4">
  <div class="card card-bagliore">
    <div class="card-body">
      <h1 class="h3 mb-3">Ricerca ricette</h1>
      <p class="text-muted">
        Scegli la modalità di ricerca preferita e lascia che TheMealDB trovi i piatti giusti per il
        tuo esperimento culinario.
      </p>

      <div class="row g-3" id="controlliRicerca">
        <div class="col-md-4">
          <label for="ricercaNome" class="form-label">Per nome</label>
          <div class="input-group">
            <input type="text" class="form-control" id="ricercaNome" placeholder="Es. Arrabiata" />
            <button class="btn btn-primary" data-ricerca="nome">Cerca</button>
          </div>
        </div>
        <div class="col-md-4">
          <label for="ricercaIngrediente" class="form-label">Per ingrediente</label>
          <div class="input-group">
            <input
              type="text"
              class="form-control"
              id="ricercaIngrediente"
              placeholder="Es. Chicken"
            />
            <button class="btn btn-primary" data-ricerca="ingrediente">Cerca</button>
          </div>
        </div>
        <div class="col-md-4">
          <label for="ricercaLettera" class="form-label">Per lettera iniziale</label>
          <div class="input-group">
            <input
              type="text"
              class="form-control"
              id="ricercaLettera"
              maxlength="1"
              placeholder="Es. a"
            />
            <button class="btn btn-primary" data-ricerca="lettera">Cerca</button>
          </div>
        </div>
      </div>
    </div>
  </div>
</section>

<section>
  <div class="d-flex align-items-center justify-content-between mb-3">
    <h2 class="h5 mb-0">Risultati</h2>
    <span class="badge bg-accento" id="conteggioRicerca">0 ricette</span>
  </div>
  <div class="row g-4" id="risultatiRicerca"></div>
</section>
