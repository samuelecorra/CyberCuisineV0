<!-- ============================================================
     HOME UTENTE LOGGATO — gestita da js/viste/vista-home-loggata.js.
     Mostra ricette suggerite in base al paese di origine/residenza del profilo (#grigliaOrigine,
     #grigliaResidenza). Il router carica questo frammento al posto di home.html quando c'è una sessione.
     ============================================================ -->
<section class="sezione-eroe text-center py-5">
  <div class="container">
    <p class="text-uppercase testo-accento fw-bold mb-2">Bentornato su CyberCuisine</p>
    <h1 class="display-5 fw-bold mb-3">Ricette dal tuo percorso</h1>
    <p class="lead m-3">
      Scopri i piatti del tuo paese di origine e di residenza, selezionati per te.
    </p>
    <div class="d-flex flex-wrap justify-content-center gap-3 mt-4">
      <a class="btn btn-primary btn-lg" href="#/esplora">Oppure inizia la ricerca</a>
    </div>
  </div>
</section>

<section class="mt-4">
  <div class="d-flex align-items-center justify-content-between mb-3">
    <h2 class="h5 mb-0">Dal tuo paese di origine</h2>
    <span class="badge bg-accento" id="conteggioOrigine">0 ricette</span>
  </div>
  <div class="row g-4" id="grigliaOrigine">
    <p class="text-muted">Caricamento ricette...</p>
  </div>
</section>

<section class="mt-4">
  <div class="d-flex align-items-center justify-content-between mb-3">
    <h2 class="h5 mb-0">Dal tuo paese di residenza</h2>
    <span class="badge bg-accento" id="conteggioResidenza">0 ricette</span>
  </div>
  <div class="row g-4" id="grigliaResidenza">
    <p class="text-muted">Caricamento ricette...</p>
  </div>
</section>
