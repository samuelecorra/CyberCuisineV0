<!-- ============================================================
     VISTA ACCESSO (LOGIN) — gestita da js/viste/vista-accesso.js
     Elementi chiave (id):
       #formLogin            → form di login (submit gestito in JS)
       #identificatoreLogin  → campo username/email
       #passwordLogin        → campo password (verificata via hash)
       #ricordaAccesso       → checkbox "Ricordami" (salva l'account cifrato in Local Storage: cc_remembered_accounts)
       #avvisoLogin          → box messaggi (errore/successo)
       #loginSpinner         → overlay spinner durante l'accesso
     ============================================================ -->
<section class="row justify-content-center">
  <div class="col-md-6">
    <div class="card card-bagliore">
      <div class="card-body">
        <h1 class="h3 mb-3">Accesso utente</h1>

        <div class="alert alert-danger d-none" id="avvisoLogin"></div>

        <form id="formLogin" novalidate>
          <div class="mb-3">
            <label for="identificatoreLogin" class="form-label">Username o email</label>
            <input type="text" class="form-control" id="identificatoreLogin" required />
          </div>

          <div class="mb-3">
            <label for="passwordLogin" class="form-label">Password</label>
            <input type="password" class="form-control" id="passwordLogin" required />
          </div>

          <div class="form-check mb-3">
            <input class="form-check-input" type="checkbox" id="ricordaAccesso" />
            <label class="form-check-label" for="ricordaAccesso"
              >Ricordami su questo dispositivo</label
            >
          </div>

          <button type="submit" class="btn btn-primary w-100" id="bottoneAccediLogin">Accedi</button>
        </form>

        <div class="text-center my-3 text-muted">
          <span>— Oppure —</span>
        </div>
        <p class="text-center mb-0">
          Non hai un account? <a href="#/registrazione">Crea subito il tuo account CyberCuisine</a>
        </p>
      </div>
    </div>
  </div>
</section>

<!-- Modal account ricordati -->
<div
  class="modal fade"
  id="modalAccountRicordati"
  tabindex="-1"
  aria-labelledby="modalAccountRicordatiTitolo"
  aria-hidden="true"
>
  <div class="modal-dialog modal-dialog-centered cc-remember-dialog">
    <div class="modal-content cc-modal cc-remember-modal">
      <div class="modal-header cc-modal-header">
        <div>
          <h2 class="h5 mb-1" id="modalAccountRicordatiTitolo">Bentornato su CyberCuisine</h2>
          <p class="mb-0 text-muted small">Seleziona un account salvato per compilare il login.</p>
        </div>
        <button
          class="cc-modal-close"
          type="button"
          aria-label="Chiudi modale account"
          data-bs-dismiss="modal"
        >
          &times;
        </button>
      </div>
      <div class="modal-body cc-modal-body pt-0">
        <div
          class="list-group cc-remember-list"
          id="listaAccountRicordati"
          role="listbox"
          aria-label="Elenco account ricordati"
        ></div>
      </div>
    </div>
  </div>
</div>

<!-- Spinner accesso -->
<div class="piadina-spinner-backdrop d-none" id="loginSpinner" aria-hidden="true">
  <div class="piadina-spinner" role="status" aria-live="polite">
    <img src="../assets/img/piadina-spinner.png" alt="Caricamento" />
    <p class="mt-3 mb-0">Un attimo, stiamo apparecchiando la tua home...</p>
  </div>
</div>
